name: build wheel with ci

on:
  # Fires only when "Build and Test" actually ran and succeeded on main.
  # Non-code pushes (docs, assets, ...) never reach here, because test.yml
  # is gated by a paths whitelist and simply doesn't run for them.
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [main]
  # Tags always build and publish — that's the release flow.
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  check-version:
    # 版本守护：workflow_run 触发（即 main 上的普通代码推送）时，若
    # pyproject.toml 里的版本号已经存在于 PyPI，说明这次推送只是验证
    # 测试而非发布 —— 跳过构建发布流水线，省一小时 cibuildwheel。
    # 要发布时 bump 版本号即可；tag / 手动触发总是构建。
    name: Check version guard
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "tag/manual trigger — always build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(grep -m1 -E '^version\s*=' pyproject.toml | sed -E 's/version\s*=\s*"([^"]+)".*/\1/')
          echo "Local version: $VERSION"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/ayafileio/${VERSION}/json")
          if [ "$HTTP" = "200" ]; then
            echo "Version $VERSION already on PyPI — test-only push, skipping build & publish"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not on PyPI — will build & publish"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build wheels on ${{ matrix.os }}
    # Only run when triggered by workflow_run with success, or always for tags/manual
    needs: check-version
    if: ${{ needs.check-version.outputs.should_build == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-latest, macos-15-intel]
      fail-fast: false
    env:
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*"
      CIBW_ARCHS_LINUX: "x86_64 aarch64 riscv64"
      CIBW_ARCHS_WINDOWS: "AMD64 x86"
      CIBW_ARCHS_MACOS: "x86_64 universal2 arm64"
      CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
      CIBW_ENABLE: "cpython-freethreading"
      CIBW_BUILD_FRONTEND: "build"
      CIBW_TEST_SKIP: "*"
      CIBW_SKIP: "*-musllinux_*"

      CIBW_ENVIRONMENT_LINUX: "ENABLE_IO_URING=ON"
      CIBW_BEFORE_ALL_LINUX: "yum install -y liburing-devel"
      
      CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=13.0"
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Check out recursively
      run: git submodule update --init --recursive
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all
    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==3.2.1
    - name: Build wheels
      run: python -m cibuildwheel --output-dir wheelhouse
    - uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl
        retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: wheels

      - name: Collect all wheels
        shell: bash
        run: |
          mkdir -p dist
          find wheels -name "*.whl" -type f -exec cp {} dist/ \;
          echo "=== Collected wheels ==="
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: false  # 48 wheels × sigstore 签名 > OIDC token lifetime
          verbose: true