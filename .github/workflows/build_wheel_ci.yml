name: build wheel with ci

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    # Only run when triggered by workflow_run with success, or always for tags/manual
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-latest, macos-15-intel]
      fail-fast: false
    env:
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*"
      CIBW_ARCHS_LINUX: "x86_64 aarch64 riscv64"
      CIBW_ARCHS_WINDOWS: "AMD64 x86"
      CIBW_ARCHS_MACOS: "x86_64 universal2 arm64"
      CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
      CIBW_ENABLE: "cpython-freethreading"
      CIBW_BUILD_FRONTEND: "build"
      CIBW_TEST_SKIP: "*"
      CIBW_SKIP: "*-musllinux_*"

      CIBW_ENVIRONMENT_LINUX: "ENABLE_IO_URING=ON"
      CIBW_BEFORE_ALL_LINUX: "yum install -y liburing-devel"
      
      CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=13.0"
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Check out recursively
      run: git submodule update --init --recursive
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all
    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==3.2.1
    - name: Build wheels
      run: python -m cibuildwheel --output-dir wheelhouse
    - uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl
        retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: wheels

      - name: Collect all wheels
        shell: bash
        run: |
          mkdir -p dist
          find wheels -name "*.whl" -type f -exec cp {} dist/ \;
          echo "=== Collected wheels ==="
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: false  # 48 wheels × sigstore 签名 > OIDC token lifetime
          verbose: true