name: build wheel with ci

on:
  # Fires only when "Build and Test" actually ran and succeeded on main.
  # Non-code pushes (docs, assets, ...) never reach here, because test.yml
  # is gated by a paths whitelist and simply doesn't run for them.
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [main]
  # Tags build and publish only after the basic tests and 100-round soak pass.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      linux_targets:
        description: 'Linux 构建目标：fast = x86_64+aarch64；riscv64 走 QEMU 极慢，补发 wheel 时选 fast 即可'
        type: choice
        options:
          - all
          - fast
          - riscv64
        default: all

# 发布流水线刻意**不**用 cancel-in-progress。
#
# test.yml 那边是 cancel-in-progress: true（旧 push 让位，省钱也让 runner 不排队），
# 但这里相反：正在往 PyPI 上传的 run 被取消意味着半个版本的产物已落盘、另一半没有，
# 是比"多跑一轮"严重得多的状态。所以这里只做串行化——后来的排队等前者跑完。
#
# 多出来的那轮通常也活不过 check-version：版本号已在 PyPI 就直接 skipped。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    # 版本守护：workflow_run 触发（即 main 上的普通代码推送）时，若
    # pyproject.toml 里的版本号已经存在于 PyPI，说明这次推送只是验证
    # 测试而非发布 —— 跳过构建发布流水线，省一小时 cibuildwheel。
    # 要发布时 bump 版本号即可；tag / 手动触发总是构建。
    name: Check version guard
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "tag/manual trigger — always build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(grep -m1 -E '^version\s*=' pyproject.toml | sed -E 's/version\s*=\s*"([^"]+)".*/\1/')
          echo "Local version: $VERSION"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/ayafileio/${VERSION}/json")
          if [ "$HTTP" = "200" ]; then
            echo "Version $VERSION already on PyPI — test-only push, skipping build & publish"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION not on PyPI — will build & publish"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  basic-tests:
    name: Build and Test
    # 所有发布都先跑基础测试，不能让条件跳过破坏后续依赖。
    uses: ./.github/workflows/test.yml

  soak:
    name: Soak 100 iterations before release
    needs: [check-version, basic-tests]
    # 基础测试失败时不得发版。
    if: ${{ needs.check-version.outputs.should_build == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/soak.yml
    with:
      iterations: "100"

  build:
    name: Build wheels on ${{ matrix.os }}
    # 基础测试与 100 轮 soak 全部通过后才构建；手动 riscv64 补发跳过普通矩阵。
    needs: [check-version, soak]
    if: ${{ needs.check-version.outputs.should_build == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'workflow_dispatch' || inputs.linux_targets != 'riscv64') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-latest, macos-15-intel]
      fail-fast: false
    env:
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
      # riscv64 拆到独立 job（见下），这里只跑快路径
      CIBW_ARCHS_LINUX: "x86_64 aarch64"
      CIBW_ARCHS_WINDOWS: "AMD64 x86"
      CIBW_ARCHS_MACOS: "x86_64 universal2 arm64"
      CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
      # cibuildwheel 4.x：free-threaded 默认构建，不再需要 enable；
      # cp315 在 2026-10-01 正式版前属于 prerelease，需要这个组
      CIBW_ENABLE: "cpython-prerelease"
      CIBW_BUILD_FRONTEND: "build"
      CIBW_TEST_SKIP: "*"
      CIBW_SKIP: "*-musllinux_*"

      CIBW_ENVIRONMENT_LINUX: "ENABLE_IO_URING=ON"
      CIBW_BEFORE_ALL_LINUX: "yum install -y liburing-devel"

      CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=13.0"
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Check out recursively
      run: git submodule update --init --recursive
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all
    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==4.2.1
    - name: Build wheels
      run: python -m cibuildwheel --output-dir wheelhouse
    - uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl
        retention-days: 7

  build-riscv64:
    # riscv64 走 QEMU 全 emulation，一个 arch 比其它所有加起来还慢。
    # 拆成独立 job：不拖快路径的反馈，flake 了可以单独重跑，
    # 手动补发 wheel 时（linux_targets=fast）可以整组跳过。
    name: Build wheels on ubuntu-24.04 (riscv64)
    needs: [check-version, soak]
    if: ${{ needs.check-version.outputs.should_build == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'workflow_dispatch' || inputs.linux_targets != 'fast') }}
    runs-on: ubuntu-24.04
    env:
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
      CIBW_ARCHS_LINUX: "riscv64"
      CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
      CIBW_ENABLE: "cpython-prerelease"
      CIBW_BUILD_FRONTEND: "build"
      CIBW_TEST_SKIP: "*"
      CIBW_SKIP: "*-musllinux_*"
      CIBW_ENVIRONMENT_LINUX: "ENABLE_IO_URING=ON"
      CIBW_BEFORE_ALL_LINUX: "yum install -y liburing-devel"
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Check out recursively
      run: git submodule update --init --recursive
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all
    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==4.2.1
    - name: Build wheels
      run: python -m cibuildwheel --output-dir wheelhouse
    - uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-ubuntu-riscv64
        path: ./wheelhouse/*.whl
        retention-days: 7

  publish:
    name: Publish to PyPI
    # 允许按输入跳过一组构建，但至少一组必须成功；否则没有产物可发布。
    needs: [check-version, build, build-riscv64]
    if: ${{ needs.check-version.outputs.should_build == 'true' && !cancelled() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (needs.build.result == 'success' || needs.build-riscv64.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: wheels

      - name: Collect all wheels
        shell: bash
        run: |
          mkdir -p dist
          find wheels -name "*.whl" -type f -exec cp {} dist/ \;
          echo "=== Collected wheels ==="
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: false  # 48 wheels × sigstore 签名 > OIDC token lifetime
          verbose: true
