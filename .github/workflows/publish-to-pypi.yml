name: Publish to PyPI (Reusable)

on:
  workflow_call:
    inputs:
      artifact-pattern:
        description: 'Pattern passed to actions/download-artifact to find wheel artifacts'
        required: false
        type: string
        default: 'wheels-*'

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC-based PyPI publishing
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: wheels

      - name: Collect all wheels
        shell: bash
        run: |
          mkdir -p dist
          find wheels -name "*.whl" -type f -exec cp {} dist/ \;
          echo "=== Collected wheels ==="
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
