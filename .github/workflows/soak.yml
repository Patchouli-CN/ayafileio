# 浸泡测试（soak）：把偶发从"大部分时间都过"里逼出来
#
# 偶发 bug 的定义就是"大多数运行通过"。单跑一次 CI 绿了说明不了任何事。
#
# 这个工作流只做一件事：**同一份代码，三平台各跑 N 次全套，第一次非零退出就停下，
# 并把当场的一切（dump / core / 日志）传上来。**
#
# 默认用 free-threaded 3.15t 放大线程交错；同类竞态在 GIL 构建上也可能发生。
#
# 触发方式：手动（可指定次数，默认 100）/ 每天一次。**不挂 push** —— 100 次 × 3 平台
# 的代价不该由每次提交承担。
name: soak

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "每个平台跑多少次全套（默认 100）"
        required: false
        default: "100"
      test_selection:
        description: "可选：pytest 节点选择器，默认全套"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      iterations:
        description: "每个平台跑多少次全套（默认 100）"
        required: false
        default: "100"
        type: string
      test_selection:
        description: "可选：pytest 节点选择器，默认全套"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: "Soak ${{ matrix.os }} (py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python-version: ["3.15t"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # 让 CPython 自己先把出错线程的 Python 栈打出来。
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
      # 打开 Yuyuko 的数据断点监视：任何线程写 ResultBatcher 的 m_mtx
      # 都会打印 WATCH-HIT（写入者模块+偏移+线程）。Linux/macOS 上是 no-op。
      AYAFILEIO_WATCH_BATCHER: "1"
      # 必须是带调试信息的构建：RelWithDebInfo = -O2 /Zi + 链接 /DEBUG，
      # 才会产出 .pdb。Release 配置下 MSVC 不生成 PDB，dump 里就只剩
      # `PyInit__ayafileio+0x1752` 这种近似符号 —— 等于知道崩在 worker 线程
      # 的某把 mutex 上，却不知道是哪一行。soak 不测性能，这点开销可以忽略。
      CMAKE_BUILD_TYPE: RelWithDebInfo
      # scikit-build-core 只认 CMAKE_ARGS；只给 CMAKE_BUILD_TYPE 环境变量不会
      # 进 CMake 缓存，构建仍是默认的 Release（= 没有 PDB）。
      CMAKE_ARGS: "-DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_DEBUG=OFF -DENABLE_VERBOSE_LOGGING=OFF"
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      ITERATIONS: ${{ inputs.iterations || github.event.inputs.iterations || '100' }}
      TEST_SELECTION: ${{ inputs.test_selection || '' }}
    steps:
    - uses: actions/checkout@v6.0.2

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Build ayafileio (RelWithDebInfo)
      timeout-minutes: 10
      run: |
        python -m pip install -U pip
        pip install -e ".[dev]" -v

    # ── 崩溃现场准备 ────────────────────────────────────────────────────
    #
    # Windows 上**不用 WER LocalDumps**：hosted runner 上两种配置都试过——
    #   * HKLM（runner 以管理员运行，写入成功）→ 崩溃后目录仍然为空
    #   * HKCU（不需要提权）                    → 同样为空
    # 所以换 procdump：它作为启动器包住 pytest，进程因未处理异常终止时自己写
    # 全内存 dump（-ma），不依赖任何系统级配置。
    - name: Install procdump (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP "procdump.zip"
        $dir = Join-Path $env:RUNNER_TEMP "procdump"
        Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dir -Force
        $exe = Join-Path $dir "procdump64.exe"
        if (-not (Test-Path $exe)) { throw "procdump64.exe not found after extract" }
        & $exe -accepteula -? | Select-Object -First 3
        echo "PROCDUMP=$exe" >> $env:GITHUB_ENV
        New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "crash_dumps") | Out-Null

    - name: Enable core dumps (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gdb
        ulimit -c unlimited || true
        sudo sysctl -w kernel.core_pattern='core.%p' || true
        mkdir -p "$RUNNER_TEMP/crash_dumps"

    - name: Note crash report dir (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir -p "$RUNNER_TEMP/crash_dumps"
        ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -5 || true

    # Python 统一调度独立 pytest 进程：默认 2 路并行，超时抓原生栈并终止当轮。
    - name: Soak ${{ env.ITERATIONS }} iterations
      id: soak
      shell: bash
      timeout-minutes: 150
      run: python tools/soak.py

    # ── 失败时把现场全部传上来 ───────────────────────────────────────────
    # dump 里栈是"地址"，要有符号才能变成函数名。PDB 就在工作区（CI 刚构建完），
    # 所以分析必须在 CI 里做；cdb 由 choco 的 windbg 包提供，属于尽力而为：
    # 装不上也不影响 dump 本身被上传。
    - name: Symbolize the dump with cdb (Windows)
      if: always() && runner.os == 'Windows' && env.SOAK_FAILED == '1'
      timeout-minutes: 15
      shell: pwsh
      run: |
        choco install -y --no-progress --limit-output windbg | Out-Null
        $cdb = (Get-ChildItem "C:\Program Files*\Windows Kits\*\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        if (-not $cdb) { Write-Host "cdb not found — dump artifacts are still uploaded"; exit 0 }
        Write-Host "cdb: $cdb"
        # 符号：微软公共符号 + 工作区（我们的 .pyd/.pdb）
        # 符号路径必须包含**构建输出目录**：pyd 与它的 pdb 都躺在 build/.../Release/，
        # 只指向仓库根是找不到的，栈上就只剩 PyInit__ayafileio+0x... 这种近似符号。
        $pdbDirs = @(Get-ChildItem -Path build -Recurse -Filter "*.pdb" -ErrorAction SilentlyContinue |
          Select-Object -ExpandProperty DirectoryName -Unique)
        $sym = "srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols;" + (($pdbDirs + $PWD.Path) -join ";")
        Write-Host "symbol path: $sym"
        Get-ChildItem "$env:RUNNER_TEMP\crash_dumps" -Filter *.dmp -ErrorAction SilentlyContinue | ForEach-Object {
          Write-Host "================ dump: $($_.Name) ================"
          & $cdb -z $_.FullName -y $sym -c ".reload /f; .ecxr; !analyze -v; ~*kb 40; q" 2>&1
        }

    - name: Upload per-iteration logs
      if: always() && env.SOAK_FAILED == '1'
      uses: actions/upload-artifact@v4
      with:
        name: soak-logs-${{ matrix.os }}-py${{ matrix.python-version }}-iter${{ steps.soak.outputs.failed_iteration }}
        path: soak/
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload crash dumps (Windows)
      if: always() && runner.os == 'Windows' && env.SOAK_FAILED == '1'
      uses: actions/upload-artifact@v4
      with:
        name: soak-dumps-${{ matrix.os }}-py${{ matrix.python-version }}-iter${{ steps.soak.outputs.failed_iteration }}
        # PDB 一起带走：万一 CI 里 cdb 装不上，事后在任何机器上都能把地址还原成函数名。
        path: |
          ${{ runner.temp }}/crash_dumps/*.dmp
          build/**/*.pdb
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload core dumps (Linux)
      if: always() && runner.os == 'Linux' && env.SOAK_FAILED == '1'
      uses: actions/upload-artifact@v4
      with:
        name: soak-cores-${{ matrix.os }}-py${{ matrix.python-version }}-iter${{ steps.soak.outputs.failed_iteration }}
        path: |
          core
          core.*
          *.core
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload crash reports (macOS)
      if: always() && runner.os == 'macOS' && env.SOAK_FAILED == '1'
      uses: actions/upload-artifact@v4
      with:
        name: soak-crashreports-${{ matrix.os }}-py${{ matrix.python-version }}-iter${{ steps.soak.outputs.failed_iteration }}
        path: |
          ~/Library/Logs/DiagnosticReports/*.ips
          ~/Library/Logs/DiagnosticReports/*.crash
        if-no-files-found: ignore
        retention-days: 14
