# 浸泡测试（soak）：把偶发从"大部分时间都过"里逼出来
#
# 偶发 bug 的定义就是"大多数运行通过"。单跑一次 CI 绿了说明不了任何事。
#
# 这个工作流只做一件事：**同一份代码，三平台各跑 N 次全套，第一次非零退出就停下，
# 并把当场的一切（dump / core / 日志）传上来。**
#
# 为什么是 free-threaded 3.15t：崩溃只出现在无 GIL 构建上，线程交错最凶。
#
# 触发方式：手动（可指定次数，默认 100）/ 每天一次。**不挂 push** —— 100 次 × 3 平台
# 的代价不该由每次提交承担。
name: soak

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "每个平台跑多少次全套（默认 100）"
        required: false
        default: "100"
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: "Soak ${{ matrix.os }} (py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python-version: ["3.15t"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # 让 CPython 自己先把出错线程的 Python 栈打出来。
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
      CMAKE_BUILD_TYPE: Release
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      ITERATIONS: ${{ github.event.inputs.iterations || '100' }}
    steps:
    - uses: actions/checkout@v6.0.2

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Build ayafileio (Release)
      timeout-minutes: 10
      run: |
        python -m pip install -U pip
        pip install -e ".[dev]" -v

    # ── 崩溃现场准备 ────────────────────────────────────────────────────
    #
    # Windows 上**不用 WER LocalDumps**：hosted runner 上两种配置都试过——
    #   * HKLM（runner 以管理员运行，写入成功）→ 崩溃后目录仍然为空
    #   * HKCU（不需要提权）                    → 同样为空
    # 所以换 procdump：它作为启动器包住 pytest，进程因未处理异常终止时自己写
    # 全内存 dump（-ma），不依赖任何系统级配置。
    - name: Install procdump (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $zip = Join-Path $env:RUNNER_TEMP "procdump.zip"
        $dir = Join-Path $env:RUNNER_TEMP "procdump"
        Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dir -Force
        $exe = Join-Path $dir "procdump64.exe"
        if (-not (Test-Path $exe)) { throw "procdump64.exe not found after extract" }
        & $exe -accepteula -? | Select-Object -First 3
        echo "PROCDUMP=$exe" >> $env:GITHUB_ENV
        New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "crash_dumps") | Out-Null

    - name: Enable core dumps (Linux)
      if: runner.os == 'Linux'
      run: |
        ulimit -c unlimited || true
        sudo sysctl -w kernel.core_pattern='core.%p' || true
        mkdir -p "$RUNNER_TEMP/crash_dumps"

    - name: Note crash report dir (macOS)
      if: runner.os == 'macOS'
      run: |
        mkdir -p "$RUNNER_TEMP/crash_dumps"
        ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -5 || true

    # ── 主循环：第一次红灯立刻停 ─────────────────────────────────────────
    #
    # 判定"红了"用三个信号，任一成立即失败（不依赖 procdump 的退出码语义）：
    #   1) 退出码非零
    #   2) 本轮新出现了 dump 文件  ← 原生崩溃
    #   3) 日志里没有 "N passed"    ← 进程中途死掉（faulthandler 只留下一行 AV）
    - name: Soak ${{ env.ITERATIONS }} iterations
      id: soak
      shell: bash
      timeout-minutes: 150
      run: |
        # GitHub 的 bash 步骤默认带 -e -o pipefail：任何"预期内会失败"的命令（比如
        # 对空目录做 ls）都会直接中止整步。这里成败由下面的判定逻辑决定，关掉它们。
        set +eo pipefail
        DUMP_DIR="$RUNNER_TEMP/crash_dumps"
        mkdir -p soak "$DUMP_DIR"

        # 数 dump 个数：用 find 而不是 ls，空目录下也返回 0。
        count_dumps() { find "$DUMP_DIR" -maxdepth 1 -name "*.dmp" 2>/dev/null | wc -l; }
        for i in $(seq 1 "$ITERATIONS"); do
          before=$(count_dumps)

          if [ "$RUNNER_OS" = "Windows" ]; then
            # procdump 需要 Windows 形式的路径；它自己拉起 python 并在崩溃时落盘。
            procdump_posix=$(cygpath -u "$PROCDUMP")
            dumpdir_win=$(cygpath -w "$DUMP_DIR")
            "$procdump_posix" -accepteula -ma -e -x "$dumpdir_win" python -m pytest -q \
              > "soak/run-$i.log" 2>&1
          else
            python -m pytest -q > "soak/run-$i.log" 2>&1
          fi
          rc=$?

          after=$(count_dumps)
          new_dumps=$((after - before))

          crashed=0
          if [ "$rc" -ne 0 ]; then crashed=1; fi
          if [ "$new_dumps" -gt 0 ]; then crashed=1; fi
          if ! grep -qE "[0-9]+ passed" "soak/run-$i.log"; then crashed=1; fi

          if [ "$crashed" -ne 0 ]; then
            echo "failed_iteration=$i" >> "$GITHUB_OUTPUT"
            echo "SOAK_FAILED=1" >> "$GITHUB_ENV"
            echo "::error::iteration $i of $ITERATIONS failed (rc=$rc, new_dumps=$new_dumps) — stopping here"
            echo "----- tail of soak/run-$i.log -----"
            tail -n 200 "soak/run-$i.log"
            exit 1
          fi

          echo "iteration $i ok: $(tail -n 1 "soak/run-$i.log")"
        done
        echo "all $ITERATIONS iterations passed"

    # ── 失败时把现场全部传上来 ───────────────────────────────────────────
    - name: Upload per-iteration logs
      if: always() && env.SOAK_FAILED == '1'
      uses: actions/upload-artifact@v4
      with:
        name: soak-logs-${{ matrix.os }}-py${{ matrix.python-version }}-iter${{ steps.soak.outputs.failed_iteration }}
        path: soak/
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload crash dumps (Windows)
      if: always() && runner.os == 'Windows' && env.SOAK_FAILED == '1'
      uses: actions/upload-artifact@v4
      with:
        name: soak-dumps-${{ matrix.os }}-py${{ matrix.python-version }}-iter${{ steps.soak.outputs.failed_iteration }}
        path: ${{ runner.temp }}/crash_dumps/*.dmp
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload core dumps (Linux)
      if: always() && runner.os == 'Linux' && env.SOAK_FAILED == '1'
      uses: actions/upload-artifact@v4
      with:
        name: soak-cores-${{ matrix.os }}-py${{ matrix.python-version }}-iter${{ steps.soak.outputs.failed_iteration }}
        path: |
          core
          core.*
          *.core
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload crash reports (macOS)
      if: always() && runner.os == 'macOS' && env.SOAK_FAILED == '1'
      uses: actions/upload-artifact@v4
      with:
        name: soak-crashreports-${{ matrix.os }}-py${{ matrix.python-version }}-iter${{ steps.soak.outputs.failed_iteration }}
        path: |
          ~/Library/Logs/DiagnosticReports/*.ips
          ~/Library/Logs/DiagnosticReports/*.crash
        if-no-files-found: ignore
        retention-days: 14
