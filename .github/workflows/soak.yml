# 浸泡测试（soak）：把偶发从"大部分时间都过"里逼出来
#
# 偶发 bug 的定义就是"大多数运行通过"。单跑一次 CI 绿了，说明不了任何事 ——
# 这一轮 Windows 3.15t 以 0xC0000005 崩过一次、重跑又绿了，正是这个处境。
#
# 所以这个工作流只做一件事：**同一份代码，三平台各跑 N 次全套，第一次非零退出就
# 停下，并把当场的一切（dump / core / 日志）传上来。**
#
# 为什么是 free-threaded 3.15t：今天的崩溃只出现在无 GIL 构建上，线程交错最凶。
#
# 触发方式：
#   * 手动：workflow_dispatch（可指定次数，默认 100）
#   * 定时：每天一次
#   * **不挂在 push 上** —— 100 次 × 3 平台的代价不该由每次提交承担。
name: soak

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "每个平台跑多少次全套（默认 100）"
        required: false
        default: "100"
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: "Soak ${{ matrix.os }} (py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    # 100 次 × 约 15 s ≈ 25 min，加上构建与 dump 收集，留足余量。
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python-version: ["3.15t"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # 崩溃时让 CPython 自己把出错线程的栈打出来（free-threaded 下 C 栈拿不到，
      # 但 Python 栈仍是最直接的线索）。
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"
      CMAKE_BUILD_TYPE: Release
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      ITERATIONS: ${{ github.event.inputs.iterations || '100' }}
    steps:
    - uses: actions/checkout@v6.0.2

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Build ayafileio (Release)
      timeout-minutes: 10
      run: |
        python -m pip install -U pip
        pip install -e ".[dev]" -v

    # ── 崩溃现场的准备：三平台各一套 ─────────────────────────────────────
    - name: Configure crash dumps (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # HKCU 不需要管理员权限；HKLM 在 hosted runner 上通常写不进去，
        # 写不进去就等于没配 —— 这正是此前一直 "No crash dumps found" 的原因。
        $dumpDir = "${{ runner.temp }}\crash_dumps"
        New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
        try {
          New-Item -Path "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpFolder" -Value $dumpDir -Type String -Force
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpType" -Value 2 -Type DWord -Force
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpCount" -Value 20 -Type DWord -Force
          Write-Host "WER LocalDumps (HKCU) configured: $dumpDir"
        } catch {
          Write-Host "WER config failed: $_"
        }
        echo "dump_dir=$dumpDir" >> $env:GITHUB_ENV

    - name: Enable core dumps (Linux)
      if: runner.os == 'Linux'
      run: |
        ulimit -c unlimited || true
        # 让 core 落在工作目录里，便于上传。
        sudo sysctl -w kernel.core_pattern='core.%p' || true
    - name: Enable crash reports (macOS)
      if: runner.os == 'macOS'
      run: |
        # macOS 的崩溃报告由系统写入 ~/Library/Logs/DiagnosticReports（.ips）。
        ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -5 || true

    # ── 主循环：第一次红灯立刻停 ─────────────────────────────────────────
    - name: Soak ${{ env.ITERATIONS }} iterations
      id: soak
      shell: bash
      timeout-minutes: 150
      run: |
        mkdir -p soak
        failed=0
        for i in $(seq 1 "$ITERATIONS"); do
          echo "=== iteration $i / $ITERATIONS ==="
          if python -m pytest -q > "soak/run-$i.log" 2>&1; then
            tail -n 1 "soak/run-$i.log"
          else
            failed=1
            echo "failed_iteration=$i" >> "$GITHUB_OUTPUT"
            echo "SOAK_FAILED=1" >> "$GITHUB_ENV"
            echo "::error::iteration $i of $ITERATIONS failed — stopping here"
            echo "----- tail of soak/run-$i.log -----"
            tail -n 200 "soak/run-$i.log"
            exit 1
          fi
        done
        echo "all $ITERATIONS iterations passed"

    # ── 失败时把现场全部传上来 ───────────────────────────────────────────
    - name: Wait for WER to finish writing dumps (Windows)
      if: always() && runner.os == 'Windows' && env.SOAK_FAILED == '1'
      shell: pwsh
      run: |
        # WerFault 在进程退出后才落盘，立刻去读必然是空目录。
        for ($i = 1; $i -le 30; $i++) {
          $found = Get-ChildItem -Path "$env:dump_dir" -Filter "*.dmp" -ErrorAction SilentlyContinue
          if ($found) { Write-Host "dump appeared after ${i}s: $($found[0].Name)"; break }
          Start-Sleep -Seconds 1
        }

    - name: Upload per-iteration logs
      if: always() && env.SOAK_FAILED == '1'
      uses: actions/upload-artifact@v4
      with:
        name: soak-logs-${{ matrix.os }}-py${{ matrix.python-version }}-iter${{ steps.soak.outputs.failed_iteration }}
        path: soak/
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload crash dumps (Windows)
      if: always() && runner.os == 'Windows' && env.SOAK_FAILED == '1'
      uses: actions/upload-artifact@v4
      with:
        name: soak-dumps-${{ matrix.os }}-py${{ matrix.python-version }}-iter${{ steps.soak.outputs.failed_iteration }}
        path: ${{ runner.temp }}/crash_dumps/*.dmp
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload core dumps (Linux)
      if: always() && runner.os == 'Linux' && env.SOAK_FAILED == '1'
      uses: actions/upload-artifact@v4
      with:
        name: soak-cores-${{ matrix.os }}-py${{ matrix.python-version }}-iter${{ steps.soak.outputs.failed_iteration }}
        path: |
          core
          core.*
          *.core
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload crash reports (macOS)
      if: always() && runner.os == 'macOS' && env.SOAK_FAILED == '1'
      uses: actions/upload-artifact@v4
      with:
        name: soak-crashreports-${{ matrix.os }}-py${{ matrix.python-version }}-iter${{ steps.soak.outputs.failed_iteration }}
        path: |
          ~/Library/Logs/DiagnosticReports/*.ips
          ~/Library/Logs/DiagnosticReports/*.crash
        if-no-files-found: ignore
        retention-days: 14
