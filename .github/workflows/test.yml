name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - 'CHANGES.md'
      - 'CHANGES_CN.md'
      - 'README.md'
      - 'README_CN.md'
      - 'LICENSE'
      - '.gitignore'
      - 'MANIFEST.in'
      - '**/*.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'CHANGES.md'
      - 'CHANGES_CN.md'
      - 'README.md'
      - 'README_CN.md'
      - 'LICENSE'
      - '.gitignore'
      - 'MANIFEST.in'
      - '**/*.md'
  workflow_dispatch:

jobs:
  test-linux:
    name: "Linux (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    env:
      CMAKE_BUILD_TYPE: Release
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y liburing-dev gdb
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nanobind scikit-build-core aiofiles rich
    - name: Build ayafileio (Release mode)
      timeout-minutes: 5
      run: |
        export CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DENABLE_DEBUG=OFF -DENABLE_VERBOSE_LOGGING=OFF"
        pip install -e . -v
    - name: Check backend info
      timeout-minutes: 1
      run: |
        python -c "import ayafileio; print(ayafileio.get_backend_info())"
    - name: Configure core dump
      run: |
        ulimit -c unlimited
        echo "ulimit -c unlimited" >> ~/.bashrc
        echo "Core dump settings:"
        cat /proc/sys/kernel/core_pattern
        echo "ulimit -c: $(ulimit -c)"
        sudo sysctl -w kernel.core_pattern=core.%e.%p.%t
        sudo sysctl -w kernel.core_uses_pid=1
        echo 1 | sudo tee /proc/sys/fs/suid_dumpable
    - name: Run tests with core dump collection
      id: run_tests
      timeout-minutes: 3
      run: |
        ulimit -c unlimited
        set +e
        python tests/test_base.py
        EXIT_BASE=$?
        python tests/test_wrap_file.py
        EXIT_WRAP=$?
        EXIT_CODE=$((EXIT_BASE + EXIT_WRAP))
        set -e
        echo "Test exit codes: base=$EXIT_BASE wrap=$EXIT_WRAP"
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        if [ $EXIT_CODE -ne 0 ]; then
          echo "Test failed with exit code $EXIT_CODE"
          echo "Looking for core dumps..."
          CORES=$(find . -name "core*" -type f 2>/dev/null | head -5)
          if [ -n "$CORES" ]; then
            echo "Found core dumps:"
            ls -la core* 2>/dev/null || true
            for CORE in $CORES; do
              echo "========================================"
              echo "Analyzing core dump: $CORE"
              echo "========================================"
              file "$CORE"
              if command -v gdb &> /dev/null; then
                echo ""
                echo "--- GDB Backtrace ---"
                PYTHON_EXE=$(which python)
                echo "Python executable: $PYTHON_EXE"
                gdb -batch -ex "thread apply all bt full" "$PYTHON_EXE" "$CORE" 2>&1 | head -200
                echo ""
                echo "--- GDB Info Threads ---"
                gdb -batch -ex "info threads" "$PYTHON_EXE" "$CORE" 2>&1
                echo ""
                echo "--- GDB Info Shared Libraries ---"
                gdb -batch -ex "info sharedlibrary" "$PYTHON_EXE" "$CORE" 2>&1 | head -50
              fi
            done
          else
            echo "No core dumps found"
          fi
          echo ""
          echo "--- dmesg segfault info ---"
          sudo dmesg | grep -i "segfault\|killed" | tail -20 || true
        fi
        exit $EXIT_CODE
    - name: Upload core dumps (if any)
      if: always() && steps.run_tests.outcome != 'success'
      uses: actions/upload-artifact@v4
      with:
        name: core-dumps-py${{ matrix.python-version }}
        path: |
          core.*
          *.core
        if-no-files-found: ignore
        retention-days: 7

  test-windows:
    name: "Windows (Python ${{ matrix.python-version }})"
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    env:
      CMAKE_BUILD_TYPE: Release
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python dependencies
      timeout-minutes: 2
      run: |
        python -m pip install --upgrade pip
        pip install nanobind scikit-build-core aiofiles rich
    - name: Build ayafileio (Release mode)
      timeout-minutes: 5
      run: |
        $env:CMAKE_ARGS = "-DCMAKE_BUILD_TYPE=Release -DENABLE_DEBUG=OFF -DENABLE_VERBOSE_LOGGING=OFF"
        pip install -e . -v
    - name: Check backend info
      timeout-minutes: 1
      run: |
        python -c "import ayafileio; print(ayafileio.get_backend_info())"
    - name: Configure crash dumps (Windows)
      timeout-minutes: 1
      shell: pwsh
      run: |
        $dumpDir = "${{ runner.temp }}\crash_dumps"
        New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
        try {
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpFolder" -Value $dumpDir -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpType" -Value 2 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpCount" -Value 10 -Type DWord -Force
          Write-Host "WER LocalDumps configured: $dumpDir"
        } catch {
          Write-Host "WER config failed (may lack admin): $_"
        }
        echo "dump_dir=$dumpDir" >> $env:GITHUB_ENV
    - name: Run tests
      timeout-minutes: 3
      id: run_tests_windows
      run: |
        python tests/test_base.py
        $EXIT_BASE = $LASTEXITCODE
        python tests/test_wrap_file.py
        $EXIT_WRAP = $LASTEXITCODE
        $EXIT_CODE = $EXIT_BASE + $EXIT_WRAP
        Write-Host "Test exit codes: base=$EXIT_BASE wrap=$EXIT_WRAP"
        echo "EXIT_CODE=$EXIT_CODE" >> $env:GITHUB_ENV
        if ($EXIT_CODE -ne 0) { exit $EXIT_CODE }
    - name: Collect and analyze crash dumps (Windows)
      if: always() && steps.run_tests_windows.outcome != 'success'
      timeout-minutes: 3
      shell: pwsh
      run: |
        $dumpDir = "$env:dump_dir"
        Write-Host "Searching for crash dumps in: $dumpDir"
        Get-ChildItem -Path $dumpDir -Filter "*.dmp" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | ForEach-Object {
          $dmp = $_.FullName
          Write-Host "========================================"
          Write-Host "Analyzing dump: $dmp ($($_.LastWriteTime))"
          Write-Host "========================================"
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (Test-Path $cdb) {
            & $cdb -z $dmp -c ".ecxr; !analyze -v; ~*kv; q" 2>&1
          } else {
            Write-Host "cdb not found, trying WinDbg..."
            $windbg = "C:\Program Files\WindowsApps\Microsoft.WinDbg_*\amd64\dbgeng.dll"
            Write-Host "Dump file available at: $dmp (size: $($_.Length) bytes)"
            Write-Host "Install WinDbg from Microsoft Store for interactive analysis"
          }
        }
        if (-not (Get-ChildItem -Path $dumpDir -Filter "*.dmp" -ErrorAction SilentlyContinue)) {
          Write-Host "No crash dumps found in $dumpDir"
          Write-Host "Checking default CrashDumps folder..."
          Get-ChildItem -Path "$env:LOCALAPPDATA\CrashDumps" -Filter "*python*" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | ForEach-Object {
            Write-Host "Found: $($_.FullName) ($($_.LastWriteTime))"
            if (Test-Path $cdb) {
              & $cdb -z $_.FullName -c ".ecxr; !analyze -v; ~*kv; q" 2>&1
            }
          }
        }
        Write-Host ""
        Write-Host "--- Application Error Events ---"
        Get-EventLog -LogName Application -Source "Application Error" -Newest 5 -ErrorAction SilentlyContinue | Format-List

  test-macos:
    name: "macOS (Python ${{ matrix.python-version }})"
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    env:
      CMAKE_BUILD_TYPE: Release
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Python dependencies
      timeout-minutes: 2
      run: |
        python -m pip install --upgrade pip
        pip install nanobind scikit-build-core aiofiles rich
    - name: Build ayafileio (Release mode)
      timeout-minutes: 5
      run: |
        export CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DENABLE_DEBUG=OFF -DENABLE_VERBOSE_LOGGING=OFF"
        pip install -e . -v
    - name: Check backend info
      timeout-minutes: 1
      run: |
        python -c "import ayafileio; print(ayafileio.get_backend_info())"
    - name: Configure core dump (macOS)
      run: |
        ulimit -c unlimited
        sudo sysctl kern.coredump=1
        echo "Core dump enabled"
    - name: Run tests
      timeout-minutes: 3
      id: run_tests_macos
      run: |
        ulimit -c unlimited
        python tests/test_base.py
        EXIT_BASE=$?
        python tests/test_wrap_file.py
        EXIT_WRAP=$?
        EXIT_CODE=$((EXIT_BASE + EXIT_WRAP))
        echo "Test exit codes: base=$EXIT_BASE wrap=$EXIT_WRAP"
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        if [ $EXIT_CODE -ne 0 ]; then
          echo "Test failed with exit code $EXIT_CODE"
          CORES=$(find /cores -name "core*" -type f -mmin -5 2>/dev/null | head -5)
          if [ -n "$CORES" ]; then
            echo "Found core dumps:"
            ls -la /cores/core* 2>/dev/null || true
            for CORE in $CORES; do
              echo "========================================"
              echo "Analyzing core dump: $CORE"
              echo "========================================"
              PYTHON_EXE=$(which python)
              lldb -c "$CORE" -o "thread backtrace all" -o "quit" 2>&1 | head -200
            done
          fi
        fi
        exit $EXIT_CODE

  benchmark:
    name: "Benchmark (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y liburing-dev
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nanobind scikit-build-core aiofiles rich
    - name: Build ayafileio (Release mode)
      env:
        CMAKE_ARGS: "-DCMAKE_BUILD_TYPE=Release -DENABLE_VERBOSE_LOGGING=OFF"
      run: |
        pip install -e . -v
    - name: Check backend info
      run: |
        python -c "import ayafileio; print(ayafileio.get_backend_info())"
    - name: Configure crash dumps (Windows)
      if: runner.os == 'Windows'
      timeout-minutes: 1
      shell: pwsh
      run: |
        $dumpDir = "${{ runner.temp }}\crash_dumps"
        New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
        try {
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpFolder" -Value $dumpDir -Type String -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpType" -Value 2 -Type DWord -Force
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpCount" -Value 10 -Type DWord -Force
          Write-Host "WER LocalDumps configured: $dumpDir"
        } catch {
          Write-Host "WER config failed (may lack admin): $_"
        }
        echo "dump_dir=$dumpDir" >> $env:GITHUB_ENV
    - name: Run speed benchmark
      id: benchmark
      timeout-minutes: 8
      shell: bash
      run: |
        set +e
        python tests/test_critical.py
        CRITICAL_EXIT=$?
        python tests/test_loguru.py
        LOGURU_EXIT=$?
        set -e

        echo "Benchmark exit codes: test_critical=$CRITICAL_EXIT test_loguru=$LOGURU_EXIT"

        # Linux/macOS: check for core dumps
        if [ "$RUNNER_OS" != "Windows" ]; then
          if [ $CRITICAL_EXIT -ne 0 ] || [ $LOGURU_EXIT -ne 0 ]; then
            CORES=$(find . /tmp -name "core*" -type f 2>/dev/null | head -5)
            if [ -n "$CORES" ]; then
              echo "=== Found core dumps ==="
              for CORE in $CORES; do
                echo "Core: $CORE"
                file "$CORE"
                if command -v gdb &> /dev/null; then
                  PYTHON_EXE=$(which python)
                  echo "--- GDB Backtrace ---"
                  gdb -batch -ex "thread apply all bt full" "$PYTHON_EXE" "$CORE" 2>&1 | head -300
                  echo "--- GDB Info Registers ---"
                  gdb -batch -ex "info registers" "$PYTHON_EXE" "$CORE" 2>&1
                fi
              done
            fi
            echo "--- dmesg ---"
            sudo dmesg | grep -i "segfault\|killed\|oom" | tail -30 || true
          fi
        fi

        exit $((CRITICAL_EXIT || LOGURU_EXIT))
    - name: Analyze crash dumps (Windows CDB)
      if: always() && runner.os == 'Windows'
      timeout-minutes: 5
      shell: pwsh
      run: |
        $dumpDir = "$env:dump_dir"
        $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
        Write-Host "=== Searching for crash dumps in: $dumpDir ==="
        $dumps = @(Get-ChildItem -Path $dumpDir -Filter "*.dmp" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending)
        if ($dumps.Count -eq 0) {
          Write-Host "No crash dumps found in $dumpDir"
          Write-Host "Checking default CrashDumps folder..."
          $dumps = @(Get-ChildItem -Path "$env:LOCALAPPDATA\CrashDumps" -Filter "*python*.dmp" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending)
        }
        if ($dumps.Count -eq 0) {
          Write-Host "No crash dumps found anywhere."
          exit 0
        }
        $PYTHON_EXE = (Get-Command python).Source
        Write-Host "Python executable: $PYTHON_EXE"
        foreach ($dmp in $dumps) {
          Write-Host "========================================"
          Write-Host "Analyzing dump: $($dmp.FullName) ($($dmp.LastWriteTime)) size=$($dmp.Length)"
          Write-Host "========================================"
          if (Test-Path $cdb) {
            Write-Host "--- CDB Stack Trace (all threads) ---"
            & $cdb -z $dmp.FullName -c ".ecxr; !analyze -v; ~*kv; q" 2>&1 | Select-Object -First 500
          } else {
            Write-Host "CDB not found at $cdb, trying alternative paths..."
            $altCdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
            if (Test-Path $altCdb) {
              & $altCdb -z $dmp.FullName -c ".ecxr; !analyze -v; ~*kv; q" 2>&1 | Select-Object -First 500
            } else {
              Write-Host "CDB not available. Dump file at: $($dmp.FullName)"
              Write-Host "Install Windows SDK Debugging Tools for analysis."
            }
          }
        }
    - name: Upload core dumps from benchmark
      if: always() && steps.benchmark.outcome != 'success'
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-core-dumps-${{ matrix.os }}
        path: |
          core.*
          *.core
          /tmp/core.*
          **/*.dmp
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ matrix.os }}
        path: |
          benchmark_results.json
          benchmark_results_detailed.json
        if-no-files-found: warn
        retention-days: 30