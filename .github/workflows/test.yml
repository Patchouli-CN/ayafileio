name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'ayafileio/**'
      - 'src/**'
      - 'tests/**'
      - '!tests/bench_*.py'
      - '!tests/stress_*.py'
      - '!tests/test_loguru.py'
      - '!tests/lang/**'
      - '!tests/i18n.py'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'ayafileio/**'
      - 'src/**'
      - 'tests/**'
      - '!tests/bench_*.py'
      - '!tests/stress_*.py'
      - '!tests/test_loguru.py'
      - '!tests/lang/**'
      - '!tests/i18n.py'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

# stdout/stderr 在 CI 里是管道（不是控制台），Python 会按 locale 代码页编码：
# windows-2022 是 cp1252、ubuntu 的 LANG 可能是 C —— 中文一 print 就
# UnicodeEncodeError。PEP 540 的 UTF-8 模式一次性解决，不需要在测试文件里
# 换 sys.stdout（那个老 hack 会把 pytest 的 capture 对象摘掉）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

# 连续推送时让被覆盖的旧 run 立刻让位。
#
# 触发原因很具体：同一小时内连推 3 次，三次都在抢同一批 macOS runner，其中一次的
# macOS 3.11 整轮排队没拿到机器，把整个 run 拖成 failure。旧 run 不释放，新 run
# 就只能等——这条把它变成"新的取代旧的"。
#
# 只作用于同 ref：main 上的新 push 取消旧 push，但不会跨 PR 互相踩。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: "C++ architecture dependencies"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check dependency and namespace boundaries
        run: python tools/check_cpp_dependencies.py

  test-linux:
    name: "Linux (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    env:
      CMAKE_BUILD_TYPE: Release
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # 3.15 正式版（2026-10-01）发布前让 setup-python 解析到 RC；
        # 对已稳定的版本无影响，正式发布后此行可删。
        allow-prereleases: true
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y liburing-dev gdb
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip
    - name: Build ayafileio (Release mode)
      timeout-minutes: 5
      run: |
        export CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DENABLE_DEBUG=OFF -DENABLE_VERBOSE_LOGGING=OFF"
        # dev 依赖只有一处真源：pyproject 的 [project.optional-dependencies].dev；
        # 构建期依赖（scikit-build-core / nanobind）由 build-system 的隔离环境安装。
        pip install -e ".[dev]" -v
    - name: Import smoke check
      timeout-minutes: 3
      shell: bash
      run: |
        python -c "import ayafileio._ayafileio"
    - name: Check backend info
      timeout-minutes: 1
      run: |
        python -c "import ayafileio, json; print(ayafileio.get_backend_info()); print(json.dumps(ayafileio.get_capabilities(), indent=2, default=str))"
    - name: Configure core dump
      run: |
        ulimit -c unlimited
        echo "ulimit -c unlimited" >> ~/.bashrc
        echo "Core dump settings:"
        cat /proc/sys/kernel/core_pattern
        echo "ulimit -c: $(ulimit -c)"
        sudo sysctl -w kernel.core_pattern=core.%e.%p.%t
        sudo sysctl -w kernel.core_uses_pid=1
        echo 1 | sudo tee /proc/sys/fs/suid_dumpable
    - name: Run tests with core dump collection
      id: run_tests
      timeout-minutes: 3
      run: |
        ulimit -c unlimited
        set +e
        python -u -m pytest -vv --capture=no -o faulthandler_timeout=30
        EXIT_CODE=$?
        set -e
        echo "pytest exit code: $EXIT_CODE"
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        if [ $EXIT_CODE -ne 0 ]; then
          echo "Test failed with exit code $EXIT_CODE"
          echo "Looking for core dumps..."
          CORES=$(find . -name "core*" -type f 2>/dev/null | head -5)
          if [ -n "$CORES" ]; then
            echo "Found core dumps:"
            ls -la core* 2>/dev/null || true
            for CORE in $CORES; do
              echo "========================================"
              echo "Analyzing core dump: $CORE"
              echo "========================================"
              file "$CORE"
              if command -v gdb &> /dev/null; then
                echo ""
                echo "--- GDB Backtrace ---"
                PYTHON_EXE=$(which python)
                echo "Python executable: $PYTHON_EXE"
                gdb -batch -ex "thread apply all bt full" "$PYTHON_EXE" "$CORE" 2>&1 | head -200
                echo ""
                echo "--- GDB Info Threads ---"
                gdb -batch -ex "info threads" "$PYTHON_EXE" "$CORE" 2>&1
                echo ""
                echo "--- GDB Info Shared Libraries ---"
                gdb -batch -ex "info sharedlibrary" "$PYTHON_EXE" "$CORE" 2>&1 | head -50
              fi
            done
          else
            echo "No core dumps found"
          fi
          echo ""
          echo "--- dmesg segfault info ---"
          sudo dmesg | grep -i "segfault\|killed" | tail -20 || true
        fi
        exit $EXIT_CODE
    - name: Upload core dumps (if any)
      if: always() && steps.run_tests.outcome != 'success'
      uses: actions/upload-artifact@v4
      with:
        name: core-dumps-py${{ matrix.python-version }}
        path: |
          core.*
          *.core
        if-no-files-found: ignore
        retention-days: 7

  test-windows:
    name: "Windows (Python ${{ matrix.python-version }})"
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    env:
      CMAKE_BUILD_TYPE: Release
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # 3.15 正式版（2026-10-01）发布前让 setup-python 解析到 RC；
        # 对已稳定的版本无影响，正式发布后此行可删。
        allow-prereleases: true
    - name: Upgrade pip
      timeout-minutes: 2
      run: |
        python -m pip install --upgrade pip
    - name: Build ayafileio (Release mode)
      timeout-minutes: 5
      run: |
        $env:CMAKE_ARGS = "-DCMAKE_BUILD_TYPE=Release -DENABLE_DEBUG=OFF -DENABLE_VERBOSE_LOGGING=OFF"
        # dev 依赖只有一处真源：pyproject 的 [project.optional-dependencies].dev；
        # 构建期依赖（scikit-build-core / nanobind）由 build-system 的隔离环境安装。
        pip install -e ".[dev]" -v
    - name: Import smoke check
      timeout-minutes: 3
      shell: bash
      run: |
        python -c "import ayafileio._ayafileio"
    - name: Check backend info
      timeout-minutes: 1
      run: |
        python -c "import ayafileio, json; print(ayafileio.get_backend_info()); print(json.dumps(ayafileio.get_capabilities(), indent=2, default=str))"
    - name: Configure crash dumps (Windows)
      timeout-minutes: 1
      shell: pwsh
      run: |
        $dumpDir = "${{ runner.temp }}\crash_dumps"
        New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
        try {
          New-Item -Path "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpFolder" -Value $dumpDir -Type String -Force
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpType" -Value 2 -Type DWord -Force
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpCount" -Value 10 -Type DWord -Force
          Write-Host "WER LocalDumps configured: $dumpDir"
        } catch {
          Write-Host "WER config failed (may lack admin): $_"
        }
        echo "dump_dir=$dumpDir" >> $env:GITHUB_ENV
    - name: Run tests
      timeout-minutes: 3
      id: run_tests_windows
      run: |
        python -m pytest -q
        $EXIT_CODE = $LASTEXITCODE
        Write-Host "pytest exit code: $EXIT_CODE"
        echo "EXIT_CODE=$EXIT_CODE" >> $env:GITHUB_ENV
        if ($EXIT_CODE -ne 0) { exit $EXIT_CODE }
    - name: Wait for WER to finish writing dumps (Windows)
      if: always() && steps.run_tests_windows.outcome != 'success'
      shell: pwsh
      run: |
        # WerFault 在进程退出后才落盘，立刻去读必然读到空目录 —— 这正是此前
        # 「No crash dumps found」的原因之一。轮询到出现文件为止，上限 30 秒。
        $dumpDir = "$env:dump_dir"
        for ($i = 1; $i -le 30; $i++) {
          $found = Get-ChildItem -Path $dumpDir -Filter "*.dmp" -ErrorAction SilentlyContinue
          if ($found) { Write-Host "dump appeared after ${i}s: $($found[0].Name)"; break }
          Start-Sleep -Seconds 1
        }
    - name: Collect and analyze crash dumps (Windows)
      if: always() && steps.run_tests_windows.outcome != 'success'
      timeout-minutes: 3
      shell: pwsh
      run: |
        $dumpDir = "$env:dump_dir"
        Write-Host "Searching for crash dumps in: $dumpDir"
        Get-ChildItem -Path $dumpDir -Filter "*.dmp" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | ForEach-Object {
          $dmp = $_.FullName
          Write-Host "========================================"
          Write-Host "Analyzing dump: $dmp ($($_.LastWriteTime))"
          Write-Host "========================================"
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (Test-Path $cdb) {
            & $cdb -z $dmp -c ".ecxr; !analyze -v; ~*kv; q" 2>&1
          } else {
            Write-Host "cdb not found, trying WinDbg..."
            $windbg = "C:\Program Files\WindowsApps\Microsoft.WinDbg_*\amd64\dbgeng.dll"
            Write-Host "Dump file available at: $dmp (size: $($_.Length) bytes)"
            Write-Host "Install WinDbg from Microsoft Store for interactive analysis"
          }
        }
        if (-not (Get-ChildItem -Path $dumpDir -Filter "*.dmp" -ErrorAction SilentlyContinue)) {
          Write-Host "No crash dumps found in $dumpDir"
          Write-Host "Checking default CrashDumps folder..."
          Get-ChildItem -Path "$env:LOCALAPPDATA\CrashDumps" -Filter "*python*" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | ForEach-Object {
            Write-Host "Found: $($_.FullName) ($($_.LastWriteTime))"
            if (Test-Path $cdb) {
              & $cdb -z $_.FullName -c ".ecxr; !analyze -v; ~*kv; q" 2>&1
            }
          }
        }
        Write-Host ""
        Write-Host "--- Application Error Events ---"
        Get-EventLog -LogName Application -Source "Application Error" -Newest 5 -ErrorAction SilentlyContinue | Format-List
    - name: Upload crash dumps (Windows)
      if: always() && steps.run_tests_windows.outcome != 'success'
      uses: actions/upload-artifact@v4
      with:
        name: crash-dumps-py${{ matrix.python-version }}
        path: |
          ${{ runner.temp }}/crash_dumps/*.dmp
        if-no-files-found: ignore
        retention-days: 7

  test-macos:
    name: "macOS (Python ${{ matrix.python-version }})"
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS 刻意只跑 3 个版本，不是漏配。
        #
        # macOS 的平台代码（Dispatch I/O、#ifdef __APPLE__）**不随解释器版本变化**，
        # 而 Python C-API 的版本差异已经由 Linux × 8 与 Windows × 8 覆盖了两遍。
        # 这里的 8 条格子重复验证同一件平台无关的事，代价却是三者里最贵、最紧张的
        # runner —— 实测出现过 macOS 3.11 整轮排队拿不到机器、把整轮 run 拖成
        # failure；而 failure 会让 build_wheel_ci 的 workflow_run 条件不成立，
        # 一次纯排队就足以卡住发版。
        #
        # 保留的三条各覆盖一个不可替代的面：
        #   3.10  —— 最老的 C-API + 老 AppleClang/SDK 组合
        #   3.14t —— 上一代 free-threading ABI
        #   3.15t —— 最新 + free-threading（macOS 上残余的 thread-state 开销在这里量）
        python-version: ["3.10", "3.14t", "3.15t"]
    env:
      CMAKE_BUILD_TYPE: Release
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # 3.15 正式版（2026-10-01）发布前让 setup-python 解析到 RC；
        # 对已稳定的版本无影响，正式发布后此行可删。
        allow-prereleases: true
    - name: Upgrade pip
      timeout-minutes: 2
      run: |
        python -m pip install --upgrade pip
    - name: Build ayafileio (Release mode)
      timeout-minutes: 5
      run: |
        export CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DENABLE_DEBUG=OFF -DENABLE_VERBOSE_LOGGING=OFF"
        # dev 依赖只有一处真源：pyproject 的 [project.optional-dependencies].dev；
        # 构建期依赖（scikit-build-core / nanobind）由 build-system 的隔离环境安装。
        pip install -e ".[dev]" -v
    - name: Import smoke check
      timeout-minutes: 3
      shell: bash
      run: |
        python -c "import ayafileio._ayafileio"
    - name: Check backend info
      timeout-minutes: 1
      run: |
        python -c "import ayafileio, json; print(ayafileio.get_backend_info()); print(json.dumps(ayafileio.get_capabilities(), indent=2, default=str))"
    - name: Configure core dump (macOS)
      run: |
        ulimit -c unlimited
        sudo sysctl kern.coredump=1
        echo "Core dump enabled"
    - name: Run tests
      timeout-minutes: 3
      id: run_tests_macos
      run: |
        ulimit -c unlimited
        python -m pytest -q
        EXIT_CODE=$?
        echo "pytest exit code: $EXIT_CODE"
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        if [ $EXIT_CODE -ne 0 ]; then
          echo "Test failed with exit code $EXIT_CODE"
          CORES=$(find /cores -name "core*" -type f -mmin -5 2>/dev/null | head -5)
          if [ -n "$CORES" ]; then
            echo "Found core dumps:"
            ls -la /cores/core* 2>/dev/null || true
            for CORE in $CORES; do
              echo "========================================"
              echo "Analyzing core dump: $CORE"
              echo "========================================"
              PYTHON_EXE=$(which python)
              lldb -c "$CORE" -o "thread backtrace all" -o "quit" 2>&1 | head -200
            done
          fi
        fi
        exit $EXIT_CODE

  # ── IOCP「完成包」交付路径（Windows 专有）────────────────────────────────
  # 一次 I/O 的收尾有两条互斥路径，由 FILE_SKIP_COMPLETION_PORT_ON_SUCCESS 决定：
  #
  #   生效   —— 同步成功不投完成包，请求由**提交线程**就地交付、当场释放
  #   不生效 —— 内核必然补投一个完成包，请求由 **worker** 交付、延迟释放
  #
  # 默认机器上该模式都生效，所以 CI 里第 2 条路径**从来没被跑过**。但它恰恰是
  # 用户机器上的常见状态：过滤驱动、杀软、网络重定向都可能让
  # SetFileCompletionNotificationModes 失败。两条路径若各自只在各自的环境里被测，
  # 差异就会一直藏着 —— 早先那里还有一个跨线程 bool 造成的双重交付与数据竞争。
  #
  # AYAFILEIO_NO_SKIP_CP=1 强制关掉该模式，让第 2 条路径在 CI 里被真正执行。
  test-iocp-packet-path:
    name: "Windows IOCP completion-packet path (py3.15)"
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      AYAFILEIO_NO_SKIP_CP: "1"
      CMAKE_BUILD_TYPE: Release
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.15"
        allow-prereleases: true
    - name: Build ayafileio (Release mode)
      timeout-minutes: 5
      run: |
        $env:CMAKE_ARGS = "-DCMAKE_BUILD_TYPE=Release -DENABLE_DEBUG=OFF -DENABLE_VERBOSE_LOGGING=OFF"
        pip install -e ".[dev]" -v
    - name: Confirm the packet path is actually forced
      # 开关必须被读到，否则这一整轮就是在默认路径上假绿 —— 和切后端那轮同一个道理。
      run: |
        python -c "import os; assert os.environ.get('AYAFILEIO_NO_SKIP_CP') == '1', 'env not set'"
        python -m pytest tests/python/test_backend_conformance.py tests/python/test_quarantine.py -q
    - name: Run the full suite through the completion-packet path
      timeout-minutes: 5
      run: python -m pytest -q

  # ── 回退后端（线程池）覆盖 ──────────────────────────────────────────────
  # ThreadIOBackend 是「io_uring / GCD / IOCP 都不可用」时的唯一路径，可以在
  # 正常 CI 里一行都跑不到（Linux 装了 liburing 就走 io_uring、macOS 走 GCD、
  # Windows 走 IOCP）。这两个 job 让它终于有名有姓地被测到：
  #   * test-fallback-backend   —— 运行时用 configure({"backend": "thread_pool"})
  #                                 强制切换，验证「同一个库换后端仍然正确」
  #   * test-no-io-uring-build  —— 干脆不装 liburing，HAVE_IO_URING 不成立，
  #                                 线程池是唯一后端（很多 manylinux 用户拿到的
  #                                 就是这样一份构建）
  # 用例里 test_async_open.py 的原生 OPENAT 断言会按 get_backend_info() 自动跳过。
  test-fallback-backend:
    name: "Fallback backend (${{ matrix.os }}, py3.14)"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows 也在内：线程池后端现在是三个平台都能显式选用的
        os: [ubuntu-24.04, macos-15, windows-2022]
    env:
      CMAKE_BUILD_TYPE: Release
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      AYAFILEIO_TEST_BACKEND: thread_pool
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y liburing-dev
    - name: Build (POSIX)
      if: runner.os != 'Windows'
      timeout-minutes: 5
      run: |
        export CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DENABLE_DEBUG=OFF -DENABLE_VERBOSE_LOGGING=OFF"
        pip install -e ".[dev]" -v
    - name: Build (Windows)
      if: runner.os == 'Windows'
      timeout-minutes: 10
      run: |
        $env:CMAKE_ARGS = "-DCMAKE_BUILD_TYPE=Release -DENABLE_DEBUG=OFF -DENABLE_VERBOSE_LOGGING=OFF"
        pip install -e ".[dev]" -v
    - name: Confirm the forced backend is active
      # 这一步必须走 pytest：切后端在 conftest 里做，下面这条用例会断言
      # AYAFILEIO_TEST_BACKEND 真的生效——否则整轮 CI 就是在默认后端上假绿。
      run: python -m pytest tests/python/test_backend_select.py -q
    - name: Run tests on the fallback backend
      timeout-minutes: 8
      run: python -m pytest -q

  test-no-io-uring-build:
    name: "Linux built without io_uring"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CMAKE_BUILD_TYPE: Release
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    # 刻意**不装** liburing-dev：HAVE_IO_URING 不成立，线程池是唯一后端
    - name: Build (thread pool only)
      timeout-minutes: 5
      run: |
        export CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DENABLE_DEBUG=OFF -DENABLE_VERBOSE_LOGGING=OFF"
        pip install -e ".[dev]" -v
    - name: Confirm this build has no io_uring
      run: |
        python -c "import ayafileio, json; i = ayafileio.get_backend_info(); print(json.dumps(i, indent=2)); assert i['backend'] == 'thread_pool', i"
    - name: Run tests
      timeout-minutes: 8
      run: python -m pytest -q

  benchmark:
    name: "Benchmark (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python-version: ["3.14"]
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # 3.15 正式版（2026-10-01）发布前让 setup-python 解析到 RC；
        # 对已稳定的版本无影响，正式发布后此行可删。
        allow-prereleases: true
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y liburing-dev
    - name: Upgrade pip
      run: |
        python -m pip install --upgrade pip
    - name: Build ayafileio (Release mode)
      env:
        CMAKE_ARGS: "-DCMAKE_BUILD_TYPE=Release -DENABLE_VERBOSE_LOGGING=OFF"
      run: |
        # dev 依赖只有一处真源：pyproject 的 [project.optional-dependencies].dev；
        # 构建期依赖（scikit-build-core / nanobind）由 build-system 的隔离环境安装。
        pip install -e ".[dev]" -v
    - name: Check backend info
      run: |
        python -c "import ayafileio, json; print(ayafileio.get_backend_info()); print(json.dumps(ayafileio.get_capabilities(), indent=2, default=str))"
    - name: Configure crash dumps (Windows)
      if: runner.os == 'Windows'
      timeout-minutes: 1
      shell: pwsh
      run: |
        $dumpDir = "${{ runner.temp }}\crash_dumps"
        New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
        try {
          New-Item -Path "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Force | Out-Null
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpFolder" -Value $dumpDir -Type String -Force
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpType" -Value 2 -Type DWord -Force
          Set-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe" -Name "DumpCount" -Value 10 -Type DWord -Force
          Write-Host "WER LocalDumps configured: $dumpDir"
        } catch {
          Write-Host "WER config failed (may lack admin): $_"
        }
        echo "dump_dir=$dumpDir" >> $env:GITHUB_ENV
    - name: Run speed benchmark
      id: benchmark
      timeout-minutes: 8
      shell: bash
      run: |
        set +e
        python benchmarks/t_compare.py
        COMPARE_EXIT=$?
        python tests/python/test_loguru.py
        LOGURU_EXIT=$?
        set -e

        echo "Benchmark exit codes: t_compare=$COMPARE_EXIT test_loguru=$LOGURU_EXIT"

        # Linux/macOS: check for core dumps
        if [ "$RUNNER_OS" != "Windows" ]; then
          if [ $COMPARE_EXIT -ne 0 ] || [ $LOGURU_EXIT -ne 0 ]; then
            CORES=$(find . /tmp -name "core*" -type f 2>/dev/null | head -5)
            if [ -n "$CORES" ]; then
              echo "=== Found core dumps ==="
              for CORE in $CORES; do
                echo "Core: $CORE"
                file "$CORE"
                if command -v gdb &> /dev/null; then
                  PYTHON_EXE=$(which python)
                  echo "--- GDB Backtrace ---"
                  gdb -batch -ex "thread apply all bt full" "$PYTHON_EXE" "$CORE" 2>&1 | head -300
                  echo "--- GDB Info Registers ---"
                  gdb -batch -ex "info registers" "$PYTHON_EXE" "$CORE" 2>&1
                fi
              done
            fi
            echo "--- dmesg ---"
            sudo dmesg | grep -i "segfault\|killed\|oom" | tail -30 || true
          fi
        fi

        exit $((COMPARE_EXIT || LOGURU_EXIT))
    - name: Analyze crash dumps (Windows CDB)
      if: always() && runner.os == 'Windows'
      timeout-minutes: 5
      shell: pwsh
      run: |
        $dumpDir = "$env:dump_dir"
        $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
        Write-Host "=== Searching for crash dumps in: $dumpDir ==="
        $dumps = @(Get-ChildItem -Path $dumpDir -Filter "*.dmp" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending)
        if ($dumps.Count -eq 0) {
          Write-Host "No crash dumps found in $dumpDir"
          Write-Host "Checking default CrashDumps folder..."
          $dumps = @(Get-ChildItem -Path "$env:LOCALAPPDATA\CrashDumps" -Filter "*python*.dmp" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending)
        }
        if ($dumps.Count -eq 0) {
          Write-Host "No crash dumps found anywhere."
          exit 0
        }
        $PYTHON_EXE = (Get-Command python).Source
        Write-Host "Python executable: $PYTHON_EXE"
        foreach ($dmp in $dumps) {
          Write-Host "========================================"
          Write-Host "Analyzing dump: $($dmp.FullName) ($($dmp.LastWriteTime)) size=$($dmp.Length)"
          Write-Host "========================================"
          if (Test-Path $cdb) {
            Write-Host "--- CDB Stack Trace (all threads) ---"
            & $cdb -z $dmp.FullName -c ".ecxr; !analyze -v; ~*kv; q" 2>&1 | Select-Object -First 500
          } else {
            Write-Host "CDB not found at $cdb, trying alternative paths..."
            $altCdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
            if (Test-Path $altCdb) {
              & $altCdb -z $dmp.FullName -c ".ecxr; !analyze -v; ~*kv; q" 2>&1 | Select-Object -First 500
            } else {
              Write-Host "CDB not available. Dump file at: $($dmp.FullName)"
              Write-Host "Install Windows SDK Debugging Tools for analysis."
            }
          }
        }
    - name: Upload core dumps from benchmark
      if: always() && steps.benchmark.outcome != 'success'
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-core-dumps-${{ matrix.os }}
        path: |
          core.*
          *.core
          /tmp/core.*
          **/*.dmp
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ matrix.os }}
        path: |
          benchmark_results.json
          benchmark_results_detailed.json
        if-no-files-found: warn
        retention-days: 30