[build-system]
requires = [
    # 1.1.0 的 FindPython 在 Linux 自由线程解释器（3.14t）上找不到
    # Development.Module，CI 构建直接挂在 configure 阶段；钉住上限待上游修复
    "scikit-build-core>=0.5.0,<1.1",
    "nanobind>=2.12.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "ayafileio"
version = "1.6.1"
description = "Cross-platform async file API for Python. Blazing fast like Shameimaru Aya."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Patchouli-CN", email = "3072252442@qq.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    
    "Topic :: System :: Filesystems",  
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    
    "Framework :: AsyncIO",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Patchouli-CN/ayafileio"
Repository = "https://github.com/Patchouli-CN/ayafileio.git"

[tool.scikit-build]
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_BUILD_TYPE=Release",
]

# 让系统为每个 Python 版本生成原生 wheel
# [tool.scikit-build.wheel]
