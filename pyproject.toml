[build-system]
requires = [
    # 1.1.0 的 FindPython 在 Linux 自由线程解释器（3.14t）上找不到
    # Development.Module，CI 构建直接挂在 configure 阶段；钉住上限待上游修复
    "scikit-build-core>=0.5.0,<1.1",
    "nanobind>=2.12.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "ayafileio"
version = "2.0.4"
description = "Cross-platform async file API for Python. Blazing fast like Shameimaru Aya."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Patchouli-CN", email = "3072252442@qq.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: C++",
    
    "Topic :: System :: Filesystems",  
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    
    "Framework :: AsyncIO",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/SatoriKomeij/ayafileio"
Repository = "https://github.com/SatoriKomeij/ayafileio.git"

[tool.scikit-build]
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"
cmake.args = [
    "-DCMAKE_CXX_STANDARD=20",
    "-DCMAKE_BUILD_TYPE=Release",
]

# 全部测试统一走 pytest：`python -m pytest` 一条命令覆盖 unittest 风格、
# 函数风格和异步用例（tests/test_base.py 里那 72 个 async def 也在内）。
# 单个文件仍然可以直接 `python tests/python/test_xxx.py`，脚本模式会打印更详细报告。
[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
# 本仓库的历史命名（AcopyTests / WrapperTests / FileLifecycleTests …）不匹配
# pytest 默认的 Test* 前缀，显式列出来，避免再靠 unittest discover 兜底。
python_classes = ["Test*", "*Tests", "*TestCase"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# 一个会话共享事件循环：IOCP 后端按 loop 缓存 ResultBatcher，
# 每测试一个新 loop 会不断新建 batcher（且 loop 地址回收后可能命中旧缓存）。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiofiles",
    "pyyaml",
    "rich",
    "build",
]

[tool.scikit-build.wheel]
packages = ["python/ayafileio"]
